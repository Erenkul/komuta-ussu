<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Defteri</title>
<style>
/* Ofisin işleri tek sayfada: kim, ne istendi, ne çıktı, sonuç ne.
   Renkler üssün ekranıyla aynı, okuma yüzeyi biraz daha açık. */
:root{--bg:#04070c;--panel:#0a141e;--panel2:#0e1c29;--read:#101f2e;--line:#1d4656;--line2:#16323f;--cy:#4fe3ff;--cy2:#a8f3ff;
--amber:#ffb648;--red:#ff5470;--ok:#55f2a9;--text:#e4f4fa;--dim:#8fb0bd;--dim2:#5f8392;--mono:Consolas,"Cascadia Mono",monospace;
--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
body{display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
a{color:var(--cy)}
.ust{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.geri{color:var(--dim);text-decoration:none;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.geri:hover{color:var(--cy2);border-color:var(--cy)}
h1{margin:0;font:600 18px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cy2)}
.proje{color:var(--dim);font-size:14px}
.sayilar{margin-left:auto;display:flex;gap:26px}
.sayi b{display:block;font:600 22px/1.1 var(--mono);color:var(--cy2)}
.sayi span{font-size:12px;color:var(--dim)}
.sayi.kir b{color:var(--red)}
.suzgec{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line2);background:var(--panel)}
.grup{display:flex;flex-wrap:wrap;min-width:0;max-width:100%;gap:4px;padding:3px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.cip{background:transparent;border:0;border-radius:6px;padding:5px 12px;color:var(--dim);cursor:pointer;font-size:14px}
.cip:hover{color:var(--text)}
.cip.on{background:var(--panel2);color:var(--cy2);box-shadow:inset 0 0 0 1px var(--line)}
select,input[type=search]{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:14px}
input[type=search]{min-width:220px;margin-left:auto}
select:focus,input:focus,.cip:focus-visible,.kart:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.govde{display:grid;grid-template-columns:minmax(340px,440px) 1fr;flex:1;min-height:0}
.liste{position:relative;overflow-y:auto;border-right:1px solid var(--line2);padding:8px 14px 40px}
.gun{position:sticky;top:0;z-index:1;background:var(--bg);padding:12px 4px 6px;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.gun small{color:var(--dim2);letter-spacing:0;text-transform:none;font:13px var(--sans);margin-left:6px}
.kart{position:relative;display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
padding:12px 14px 12px 18px;margin:0 0 8px;cursor:pointer}
.kart::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--renk)}
.kart:hover{border-color:var(--line)}
.kart.sec{border-color:var(--cy);background:var(--panel2)}
.kim{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.kim b{color:var(--text);font-weight:600;font-size:14px}
.top{width:22px;height:22px;border-radius:50%;background:var(--renk);color:#04070c;display:grid;place-items:center;font:700 11px var(--sans);flex:none}
.saat{margin-left:auto;font:12px var(--mono);color:var(--dim2)}
.etiket{display:block;margin-top:9px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.istenen{margin:2px 0 0;font-weight:600;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cikan{margin:2px 0 0;color:var(--dim);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rozet{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.rozet.ok{color:var(--ok);border-color:#1f6b45}
.rozet.orta{color:var(--amber);border-color:#7a5a22}
.rozet.kotu,.rozet.kir{color:var(--red);border-color:#7a2a3b}
.rozet.tur{color:var(--cy2);border-color:var(--line)}
.okuma{overflow-y:auto;padding:28px 40px 60px;background:linear-gradient(var(--read),var(--bg) 70%)}
.bos{color:var(--dim);max-width:520px;margin:80px auto;text-align:center}
.bos h2{color:var(--text);font-size:20px;margin:0 0 8px}
.yazi{max-width:76ch;margin:0 auto}
.yazi .kim{font-size:14px}
.yazi .top{width:30px;height:30px;font-size:13px}
.yazi h2.baslik{font-size:24px;line-height:1.3;margin:14px 0 10px}
.yazi .alt{margin:0 0 24px}
.bolum{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px 24px;margin:0 0 16px}
.bolum>.etiket{margin:0 0 10px}
.md{font-size:16px;line-height:1.65}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.3em 0 .5em;color:var(--cy2)}
.md h1{font-size:21px}.md h2{font-size:19px}.md h3{font-size:17px}.md h4{font-size:16px}
.md>:first-child{margin-top:0}
.md p{margin:.6em 0}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}
.md li{margin:.3em 0}
.md li::marker{color:var(--cy)}
.md strong{color:#fff}
.md code{font:14px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px}
.md blockquote{margin:.8em 0;padding:4px 14px;border-left:3px solid var(--line);color:var(--dim)}
.md table{border-collapse:collapse;margin:.8em 0;font-size:15px;width:100%}
.md th,.md td{border:1px solid var(--line2);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel2);color:var(--cy2)}
.md hr{border:0;border-top:1px solid var(--line2);margin:1.2em 0}
.pasla{font-size:14px;color:var(--amber)}
details.bolum summary{cursor:pointer;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);list-style:none}
details.bolum summary::before{content:"▸ ";color:var(--cy)}
details.bolum[open] summary::before{content:"▾ "}
details.bolum[open] summary{margin-bottom:10px}
.eylem{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eylem button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
.eylem button:hover{border-color:var(--cy)}
.eylem .iyi{color:var(--ok);border-color:#1f6b45}
.eylem .kotu{color:var(--red);border-color:#7a2a3b}
.eylem span{color:var(--dim);font-size:13px}
.not{color:var(--dim2);font-size:13px;margin-top:14px}
.donus{display:none}
@media (max-width:900px){
 .sayilar{display:none}
 .ust{flex-wrap:wrap;padding:12px 16px;gap:10px}
 .suzgec{padding:10px 16px}
 .govde{grid-template-columns:minmax(0,1fr);height:auto}
 .liste{padding:6px 16px 40px}
 .kart{min-width:0}
 html,body{overflow-x:hidden}
 .suzgec>*{max-width:100%}
 .liste{border-right:0;overflow:visible}
 .okuma{display:none;padding:18px 16px 40px}
 body{display:block}
 body.oku .liste{display:none}
 body.oku .okuma{display:block}
 .donus{display:inline-block;margin-bottom:12px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--dim);cursor:pointer}
 input[type=search]{min-width:0;flex:1 1 100%;margin-left:0}
}
</style>
</head>
<body>
<header class="ust">
  <a class="geri" href="/">← Ofise dön</a>
  <h1>İş Defteri</h1>
  <span class="proje" id="proje"></span>
  <div class="sayilar">
    <div class="sayi"><b id="sBugun">–</b><span>bugün biten</span></div>
    <div class="sayi"><b id="sHafta">–</b><span>son 7 gün</span></div>
    <div class="sayi"><b id="sPuan">–</b><span>ortalama puan</span></div>
    <div class="sayi kir"><b id="sKar">–</b><span>karantinada</span></div>
  </div>
</header>
<div class="suzgec">
  <div class="grup" id="donem" role="group" aria-label="Zaman">
    <button class="cip" data-v="bugun">Bugün</button><button class="cip on" data-v="hafta">Son 7 gün</button><button class="cip" data-v="hepsi">Tümü</button>
  </div>
  <div class="grup" id="tur" role="group" aria-label="Tür">
    <button class="cip on" data-v="">Hepsi</button><button class="cip" data-v="Günlük iş">Günlük iş</button><button class="cip" data-v="Plan">Plan</button><button class="cip" data-v="Ar-Ge">Ar-Ge</button><button class="cip" data-v="Rapor">Rapor</button><button class="cip" data-v="karantina">Karantina</button>
  </div>
  <select id="ajan" aria-label="Ajan"><option value="">Bütün ekip</option></select>
  <input type="search" id="ara" placeholder="İşlerde ara…" aria-label="İşlerde ara">
</div>
<main class="govde">
  <section class="liste" id="liste" aria-label="İşler"></section>
  <section class="okuma" id="okuma" aria-live="polite">
    <div class="bos"><h2>Bir iş seç</h2>Soldaki kartlardan birine tıkla: kimin yaptığı, ne istendiği ve ne çıktığı burada okunur.</div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
// Seçili kartı yalnız listenin içinde kaydırır: scrollIntoView bütün sayfayı da kaydırıyordu.
function gor(orta){const k=$('liste'),c=k.querySelector('.kart.sec');if(!c)return;const ust=c.offsetTop,alt=ust+c.offsetHeight;
 if(orta)k.scrollTop=ust-(k.clientHeight-c.offsetHeight)/2;else if(ust<k.scrollTop+40)k.scrollTop=ust-40;else if(alt>k.scrollTop+k.clientHeight)k.scrollTop=alt-k.clientHeight+8}
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TUR_ACIK={'Günlük iş':'Her gün tekrarlanan iş','Plan':'Bir hedefin parçası','Ar-Ge':'Kendi alanında araştırma','Rapor':'Müdürün özeti'};
let isler=[],secili=null,suz={donem:'hafta',tur:'',ajan:'',ara:''};
const kac=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gunAnahtar=z=>z.slice(0,10);
function gunAdi(a){const d=new Date(a+'T12:00'),b=new Date();b.setHours(12,0,0,0);const f=Math.round((b-d)/864e5);
 const t=d.getDate()+' '+AY[d.getMonth()];return f===0?['Bugün',t]:f===1?['Dün',t]:[GUN[d.getDay()],t]}
function puanSinif(p){return p==null?'':p>=90?'ok':p>=80?'orta':'kotu'}
function rozetler(x,uzun){const r=['<span class="rozet tur" title="'+kac(TUR_ACIK[x.tur]||'')+'">'+kac(x.tur)+'</span>'];
 if(x.puan!=null)r.push('<span class="rozet '+puanSinif(x.puan)+'" title="Kural puanı: bilinen hataları sayar">'+x.puan+' puan</span>');
 if(x.durum==='karantina')r.push('<span class="rozet kir" title="Güvenlik kuralına takıldı, kullanılmaz">Karantinada</span>');
 else if(x.tur!=='Rapor')r.push('<span class="rozet ok" title="Turing\'in güvenlik kurallarından geçti">Güvenlikten geçti</span>');
 if(x.akran)r.push('<span class="rozet" title="Bir iş arkadaşı okuyup not düştü, yazar bir kez düzeltti">İş arkadaşı baktı</span>');
 if(uzun&&x.model)r.push('<span class="rozet" title="Yazan model">'+kac(x.model.replace('opencode/',''))+'</span>');
 return r.join('')}
function suzulmus(){const simdi=Date.now();return isler.filter(x=>{
 const yas=(simdi-new Date(x.zaman))/864e5;
 if(suz.donem==='bugun'&&gunAnahtar(x.zaman)!==new Date().toLocaleDateString('sv'))return false;
 if(suz.donem==='hafta'&&yas>7)return false;
 if(suz.tur==='karantina'?x.durum!=='karantina':suz.tur&&x.tur!==suz.tur)return false;
 if(suz.ajan&&x.kim!==suz.ajan)return false;
 if(suz.ara){const q=suz.ara.toLocaleLowerCase('tr');if(!(x.gorev+' '+x.ozet+' '+x.ajan).toLocaleLowerCase('tr').includes(q))return false}
 return true})}
function ciz(){const L=suzulmus(),k=$('liste');
 if(!L.length){k.innerHTML='<div class="bos"><h2>Bu süzgeçte iş yok</h2>Zamanı “Tümü” yap ya da aramayı temizle.</div>';return}
 let h='',son='';
 for(const x of L){const g=gunAnahtar(x.zaman);if(g!==son){son=g;const n=L.filter(y=>gunAnahtar(y.zaman)===g).length,[a,t]=gunAdi(g);
   h+='<div class="gun">'+a+'<small>'+t+' · '+n+' iş</small></div>'}
  h+='<button class="kart'+(secili&&secili.ad===x.ad&&secili.yer===x.yer?' sec':'')+'" style="--renk:'+kac(x.renk)+'" data-ad="'+kac(x.ad)+'" data-yer="'+x.yer+'">'+
   '<span class="kim"><span class="top">'+kac(x.ajan[0]||'?')+'</span><b>'+kac(x.ajan)+'</b>'+kac(x.unvan)+'<span class="saat">'+x.zaman.slice(11,16)+'</span></span>'+
   '<span class="etiket">İstenen</span><p class="istenen">'+kac(x.gorev)+'</p>'+
   '<span class="etiket">Çıkan</span><p class="cikan">'+kac(x.ozet)+'</p>'+
   '<span class="alt">'+rozetler(x)+'</span></button>'}
 k.innerHTML=h;
 k.querySelectorAll('.kart').forEach(b=>b.onclick=()=>ac(isler.find(x=>x.ad===b.dataset.ad&&x.yer===b.dataset.yer)))}
function satirIci(s){return kac(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
 .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(metin){const S=metin.replace(/\r/g,'').split('\n');let h='',liste=null,para=[];
 const kapa=()=>{if(para.length){h+='<p>'+para.map(satirIci).join('<br>')+'</p>';para=[]}if(liste){h+='</'+liste+'>';liste=null}};
 for(let i=0;i<S.length;i++){const s=S[i],t=s.trim();let m;
  if(!t){kapa();continue}
  if(/^\|.*\|$/.test(t)&&i+1<S.length&&/^\|?\s*:?-{2,}/.test(S[i+1].trim())){kapa();const hucre=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>satirIci(c.trim()));
   h+='<table><thead><tr>'+hucre(t).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';i++;
   while(i+1<S.length&&/^\|.*\|$/.test(S[i+1].trim())){i++;h+='<tr>'+hucre(S[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>'}h+='</tbody></table>';continue}
  if(m=t.match(/^(#{1,4})\s+(.*)/)){kapa();h+='<h'+m[1].length+'>'+satirIci(m[2])+'</h'+m[1].length+'>';continue}
  if(/^(-{3,}|\*{3,})$/.test(t)){kapa();h+='<hr>';continue}
  if(m=t.match(/^>\s?(.*)/)){kapa();h+='<blockquote>'+satirIci(m[1])+'</blockquote>';continue}
  if(m=t.match(/^PASLA\W+(.*)/i)){kapa();h+='<p class="pasla">↪ İşi devretti: '+satirIci(m[1])+'</p>';continue}
  if(m=t.match(/^[-*•]\s+(.*)/)){para.length&&kapa();if(liste!=='ul'){liste&&kapa();h+='<ul>';liste='ul'}h+='<li>'+satirIci(m[1])+'</li>';continue}
  if(m=t.match(/^(\d+)[.)]\s+(.*)/)){para.length&&kapa();if(liste!=='ol'){liste&&kapa();h+='<ol start="'+m[1]+'">';liste='ol'}h+='<li>'+satirIci(m[2])+'</li>';continue}
  if(liste&&/^\s{2,}\S/.test(s)){h=h.replace(/<\/li>$/,'<br>'+satirIci(t)+'</li>');continue}
  if(liste)kapa();para.push(t)}
 kapa();return h}
function bolumler(metin){const b={};let ad='_bas';b[ad]=[];
 for(const s of metin.replace(/<!--[\s\S]*?-->/g,'').split('\n')){const m=s.match(/^##\s+(.+)/);if(m){ad=m[1].trim();b[ad]=[]}else b[ad].push(s)}
 for(const k in b)b[k]=b[k].join('\n').trim();return b}
async function ac(x){if(!x)return;secili=x;document.body.classList.add('oku');
 document.querySelectorAll('.kart').forEach(k=>k.classList.toggle('sec',k.dataset.ad===x.ad&&k.dataset.yer===x.yer));
 const o=$('okuma');o.innerHTML='<div class="bos">Açılıyor…</div>';
 let metin='';try{const r=await fetch('/taslak?ad='+encodeURIComponent(x.ad)+'&yer='+x.yer);metin=r.ok?await r.text():''}catch(e){}
 if(secili!==x)return;
 const b=bolumler(metin),gorev=b['Görev']||x.gorev;
 const sonuc=x.yer==='rapor'?metin.replace(/<!--[\s\S]*?-->/g,''):(b['Taslak']||Object.entries(b).filter(([k])=>!['Görev','Akran notu'].includes(k)).map(([k,v])=>k==='_bas'?v:'## '+k+'\n'+v).join('\n\n'));
 const d=new Date(x.zaman),[ga]=gunAdi(gunAnahtar(x.zaman));
 let h='<div class="yazi" style="--renk:'+kac(x.renk)+'"><button class="donus" id="donus">← İşlere dön</button>'+
  '<span class="kim"><span class="top">'+kac(x.ajan[0]||'?')+'</span><b>'+kac(x.ajan)+'</b>'+kac(x.unvan)+'<span class="saat">'+ga+', '+d.getDate()+' '+AY[d.getMonth()]+' · '+x.zaman.slice(11,16)+'</span></span>'+
  '<h2 class="baslik">'+kac(x.yer==='rapor'?x.gorev:gorev.split('\n')[0])+'</h2><div class="alt">'+rozetler(x,true)+'</div>';
 if(x.yer!=='rapor'&&gorev.includes('\n'))h+='<details class="bolum"><summary>İstenenin tamamı</summary><div class="md">'+md(gorev)+'</div></details>';
 h+='<div class="bolum"><span class="etiket">'+(x.yer==='rapor'?'Rapor':'Ne çıktı')+'</span><div class="md">'+(md(sonuc)||'<p>Metin bulunamadı.</p>')+'</div></div>';
 if(b['Akran notu']&&!/^yok/i.test(b['Akran notu']))h+='<details class="bolum"><summary>İş arkadaşının notu</summary><div class="md">'+md(b['Akran notu'])+'</div></details>';
 h+='<div class="eylem">'+(x.yer==='ciktilar'?'<button class="iyi" data-oy="iyi">👍 İyi, örnek olsun</button><button class="kotu" data-oy="kötü">👎 Kötü</button>':'')+
  '<button id="kopya">Metni kopyala</button><span id="sonuc"></span></div>'+
  '<p class="not">Taslaklar sen ya da baş ajan onaylamadan kullanılmaz. “İyi” dediğin taslak o ajana örnek olur, “Kötü” hata sayılır.</p></div>';
 o.innerHTML=h;o.scrollTop=0;
 $('donus').onclick=()=>document.body.classList.remove('oku');
 $('kopya').onclick=async()=>{try{await navigator.clipboard.writeText(sonuc);$('sonuc').textContent='Kopyalandı'}catch(e){$('sonuc').textContent='Kopyalanamadı'}};
 o.querySelectorAll('[data-oy]').forEach(bt=>bt.onclick=async()=>{const r=await fetch('/oy',{method:'POST',body:x.ad+' '+bt.dataset.oy});
  $('sonuc').textContent=r.ok?(bt.dataset.oy==='iyi'?'Teşekkürler: bu taslak '+x.ajan+'\'ya örnek olacak':'Not edildi: '+x.ajan+' bu hatayı bir daha yapmamaya çalışacak'):'Oy kaydedilemedi'})}
function sayilar(){const bugun=new Date().toLocaleDateString('sv'),simdi=Date.now();
 const B=isler.filter(x=>gunAnahtar(x.zaman)===bugun&&x.tur!=='Rapor'),H=isler.filter(x=>(simdi-new Date(x.zaman))/864e5<=7&&x.tur!=='Rapor');
 const P=H.filter(x=>x.puan!=null);$('sBugun').textContent=B.length;$('sHafta').textContent=H.length;
 $('sPuan').textContent=P.length?Math.round(P.reduce((a,x)=>a+x.puan,0)/P.length):'–';$('sKar').textContent=isler.filter(x=>x.durum==='karantina').length}
async function yukle(){try{const r=await fetch('/isler.json');isler=await r.json()}catch(e){$('liste').innerHTML='<div class="bos"><h2>Ofise ulaşılamadı</h2>Ofis kapalı olabilir. Komuta Üssü kısayolundan aç.</div>';return}
